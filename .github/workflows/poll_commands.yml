name: Poll WhatsApp commands

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Poll and process commands
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
        run: python scripts/poll_commands.py

      - name: Commit updated subscriber data
        run: |
          git config user.name "AgnaMarket Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/subscribers.json data/.last_poll.txt 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Update subscribers [automated]"
          git push
